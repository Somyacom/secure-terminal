# /etc/nginx/conf.d/secure-terminal.conf
# nginx держит TLS 1.3 и первый рубеж лимитов; сервер слушает 127.0.0.1:8000 с --behind-proxy.

limit_req_zone  $binary_remote_addr zone=st_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=st_conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name st.example.ru;

    ssl_certificate     /etc/ssl/secure-terminal/fullchain.pem;
    ssl_certificate_key /etc/ssl/secure-terminal/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_session_tickets off;

    # Подпись в заголовке ≈ 4,5 КБ; тело ≤ 17 КБ
    large_client_header_buffers 4 16k;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    limit_req  zone=st_req burst=40 nodelay;
    limit_conn st_conn 20;
    limit_req_status 429;

    # Пускать только сеть терминалов (замените на свои диапазоны)
    # allow 10.20.0.0/16;
    # deny  all;

    location /v1/ {
        # БЕЗ слеша и URI после адреса: путь и query уходят байт в байт (они подписаны)
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # перезаписываем, не дописываем
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
    }

    location / { return 404; }
}
